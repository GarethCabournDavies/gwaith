# Paths are relative to this file. Angles are radians; masses are SSB/detector-frame solar masses.
# Placement uses FastBHB IMRPhenomHM, TDI-2, (2,2), retaining 99% of A/E SNR.
[waveform]
delta_t = 4.0
initial_position_deg = -140.0
laser_frequency = 2.816e14
# Minimum analysis frequency; each template start frequency is calculated separately.
f_lower = 0.00003
f_upper = 0.09
snr_fraction = 0.99
taper_seconds = 3600.0

[bank]
output_file = "output/mojito_bank.hdf"
psd_A = "../search/output/mojito/round_0/psd/A_mojito_SMOOTHED_PSD.txt"
psd_E = "../search/output/mojito/round_0/psd/E_mojito_SMOOTHED_PSD.txt"
# These PSDs come from data divided by the laser frequency.
psd_units = "fractional_frequency"
min_match = 0.9
tolerance = 0.02
window = 200
batch = 40
max_proposals = 200000
max_lag_seconds = 500.0
# resume = "output/mojito_bank.hdf"

[prior.total_mass]
min = 300000.0
max = 50000000.0
distribution = "log_uniform"
[prior.q]
min = 1.0
max = 10.0
distribution = "uniform"
[prior.spin1z]
min = -0.99
max = 0.99
distribution = "uniform"
[prior.spin2z]
min = -0.99
max = 0.99
distribution = "uniform"
[prior.eclipticlatitude]
min = -1.5707963267948966
max = 1.5707963267948966
distribution = "sin_uniform"
[prior.eclipticlongitude]
min = 0.0
max = 6.283185307179586
distribution = "uniform"
[prior.inclination]
min = 0.0
max = 3.141592653589793
distribution = "cos_uniform"
[prior.polarization]
min = 0.0
max = 3.141592653589793
distribution = "uniform"
[prior.coa_phase]
min = 0.0
max = 6.283185307179586
distribution = "uniform"
