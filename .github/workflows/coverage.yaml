name: Coverage
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git dependency access
        env:
          GH_TOKEN: ${{ secrets.GH_DEPENDENCY_TOKEN || github.token }}
        run: |
          # Install SSH and HTTPS dependency URLs through authenticated HTTPS.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' coverage

      - name: Run tests with coverage
        run: python -m coverage run --source=hwilas,tools -m pytest tests

      - name: Generate coverage reports
        if: ${{ !cancelled() }}
        run: |
          python -m coverage report -m
          python -m coverage xml
          python -m coverage lcov
          python -m coverage html

      - name: Save coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Upload coverage to Qlty
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage.lcov
