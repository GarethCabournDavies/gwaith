name: Ruff Checks
on: [pull_request]

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    ruff_check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Ruff
              run: python -m pip install --upgrade ruff

            - name: Run Ruff
              run: ruff check . --output-format=github