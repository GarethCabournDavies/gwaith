[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwilas"
version = "0.1.0"
description = "Command-line tools for MBHB LISA searches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"numpy",
	"tqdm",
	"pyswarms>=1.3.0",
	"h5py",
    "PyYAML>=6",
	"scipy",
	"matplotlib",
	"gwaith @ git+ssh://git@github.com/uk-lisa-gs/gwaith.git",
    "mojito-processor @ git+https://github.com/OllieBurke/MojitoProcessor.git",
	"gwreparam @ git+ssh://git@github.com/uk-lisa-gs/gwreparam.git",
    "tdispline @ git+ssh://git@github.com/uk-lisa-gs/tdi-spline.git",
    "phenomxpy==2.0.3",
    "lisaorbits",
    "lisa-data-challenge",
    "lisabeta",
    "fastgb",
]

[project.optional-dependencies]

test = [
	"pytest",
	"pycbc",
]

[project.scripts]

# Data preparation
hwilas_prepare_mojito = "tools.data_processing.prepare_mojito:main"
hwilas_process_mojito_data_chunk = "tools.data_processing.process_mojito_data:main"
hwilas_mojito_clean_windows = "tools.data_processing.mojito_clean_windows:main"
hwilas_process_sangria_data = "tools.data_processing.process_sangria_data:main"
hwilas_process_data_combine = "tools.data_processing.process_data_combine:main"

# PSD estimation
hwilas_estimate_psd = "tools.psd_estimation.estimate_psd:main"

# Template bank generation and verification
hwilas_make_stochastic_bank = "tools.template_banks.stochastic_bank:main"
hwilas_verify_bank = "tools.template_banks.verify_bank:main"

# Search, fitting and subtraction
hwilas_matched_filter_search = "tools.search.matched_filter_search:main"
hwilas_trigger_merge = "tools.search.trigger_merge:main"
hwilas_optimise_snr_peaks = "tools.search.optimise_snr_peaks:main"
hwilas_subtract_signals = "tools.search.subtract_signals:main"
hwilas_check_search_residuals = "tools.search.check_search_residuals:main"

# Candidate and fitted-event catalogues
hwilas_collect_search_candidates = "tools.search.collect_search_candidates:main"
hwilas_combine_search_parameters = "tools.search.combine_search_parameters:main"
hwilas_export_pe_seed = "tools.search.export_pe_seed:main"
hwilas_candidate_hdf_to_csv = "tools.search.candidate_hdf_to_csv:main"

# Injection truth and Sangria SNR diagnostics
hwilas_extract_truth = "tools.data_processing.extract_truth:main"
hwilas_sangria_optimal_snr = "tools.search.optimal_snr.sangria_optimal_snr:main"

# Data and PSD plots
hwilas_plot_processed_data = "tools.plotting.plot_processed_data:main"
hwilas_plot_chunked_data = "tools.plotting.plot_chunked_data:main"
hwilas_plot_psd = "tools.plotting.plot_psd:main"

# Template bank plots
hwilas_plot_bank = "tools.template_banks.plot_mbhb_bank:main"
hwilas_plot_bank_verification = "tools.plotting.plot_bank_verification:main"

# Search and waveform plots
hwilas_plot_trigger_merge = "tools.plotting.plot_trigger_merge:main"
hwilas_plot_matched_filter_snr_timeseries = "tools.plotting.plot_matched_filter_snr_timeseries:main"
hwilas_plot_mojito_waveforms = "tools.plotting.plot_mojito_waveforms:main"
hwilas_plot_sangria_waveforms = "tools.plotting.plot_sangria_waveforms:main"
hwilas_plot_optimise_waveforms = "tools.plotting.plot_optimise_waveforms:main"
hwilas_plot_subtracted_signals = "tools.search.plot_subtracted_signals:main"

[tool.setuptools.packages.find]
include = ["hwilas*", "tools*"]
